<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 350" width="320" height="350" fill="none">
  <defs>
    <!-- Top Arc for Hindi Devanagari Text (Clockwise from ~195 deg to -15 deg) -->
    <path id="gecHindiTextArc" d="M 52 150 A 108 108 0 0 1 268 150" fill="none" />
    <!-- Bottom Arc for English Text (Counter-Clockwise so text stands upright) -->
    <path id="gecEnglishTextArc" d="M 52 150 A 108 108 0 0 0 268 150" fill="none" />
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Group with subtle shadow -->
  <g filter="url(#subtleShadow)">
    <!-- 1. Outer Cogwheel / Gear with 16 Teeth (Orange outline, White fill) -->
    <path 
      d="M 142.6 33.3 L 149.2 12.4 L 170.8 12.4 L 177.4 33.3 L 188.5 35.5 L 202.6 18.8 L 222.7 27.0 L 220.8 48.9 L 230.2 55.1 L 249.6 45.1 L 264.9 60.4 L 254.9 79.8 L 261.1 89.2 L 283.0 87.3 L 291.2 107.4 L 274.5 121.5 L 276.7 132.6 L 297.6 139.2 L 297.6 160.8 L 276.7 167.4 L 274.5 178.5 L 291.2 192.6 L 283.0 212.7 L 261.1 210.8 L 254.9 220.2 L 264.9 239.6 L 249.6 254.9 L 230.2 244.9 L 220.8 251.1 L 222.7 273.0 L 202.6 281.2 L 188.5 264.5 L 177.4 266.7 L 170.8 287.6 L 149.2 287.6 L 142.6 266.7 L 131.5 264.5 L 117.4 281.2 L 97.3 273.0 L 99.2 251.1 L 89.8 244.9 L 70.4 254.9 L 55.1 239.6 L 65.1 220.2 L 58.9 210.8 L 37.0 212.7 L 28.8 192.6 L 45.5 178.5 L 43.3 167.4 L 22.4 160.8 L 22.4 139.2 L 43.3 132.6 L 45.5 121.5 L 28.8 107.4 L 37.0 87.3 L 58.9 89.2 L 65.1 79.8 L 55.1 60.4 L 70.4 45.1 L 89.8 55.1 L 99.2 48.9 L 97.3 27.0 L 117.4 18.8 L 131.5 35.5 Z" 
      fill="#FFFFFF" 
      stroke="#E26610" 
      stroke-width="3" 
      stroke-linejoin="round"
    />

    <!-- Circular Gear Root Rim -->
    <circle cx="160" cy="150" r="118" stroke="#E26610" stroke-width="2" fill="none" />

    <!-- 2. Text Band Background (White ring) -->
    <circle cx="160" cy="150" r="117" fill="#FFFFFF" />

    <!-- 3. Inner Circular Green Ring -->
    <circle cx="160" cy="150" r="82" fill="#FFFFFF" stroke="#16A34A" stroke-width="3.5" />
  </g>

  <!-- 4. Circular Text in White Band -->
  <!-- Top: Hindi Devanagari -->
  <text fill="#1E293B" font-family="'Noto Sans Devanagari', 'Mangal', 'Poppins', -apple-system, sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.2">
    <textPath href="#gecHindiTextArc" startOffset="50%" text-anchor="middle">
      राजकीय अभियांत्रिकी महाविद्यालय, बाड़मेर
    </textPath>
  </text>

  <!-- Blue Separator Dots at 9 o'clock and 3 o'clock -->
  <circle cx="48" cy="150" r="4" fill="#0284C7" />
  <circle cx="272" cy="150" r="4" fill="#0284C7" />

  <!-- Bottom: English Text -->
  <text fill="#1E293B" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-size="10.8" font-weight="800" letter-spacing="0.8">
    <textPath href="#gecEnglishTextArc" startOffset="50%" text-anchor="middle">
      GOVERNMENT ENGINEERING COLLEGE, BARMER
    </textPath>
  </text>

  <!-- 5. Central Petroleum Oil Pumpjack Rig (Barmer Oilfield Symbol) -->
  <g id="oilPumpjack">
    <!-- Crude Oil Reservoir Bedrock / Spurt Base -->
    <path 
      d="M 109 176 L 207 176 L 206 188 C 205 194 200 197 197 202 C 193 207 188 206 185 199 C 182 192 178 205 172 208 C 166 211 161 213 157 207 C 153 201 149 203 146 209 C 142 214 135 212 131 204 C 127 197 122 201 119 196 C 115 191 110 188 109 176 Z" 
      fill="#111827" 
    />

    <!-- Pumpjack Platform Bedplate -->
    <rect x="110" y="171" width="94" height="5" rx="1.5" fill="#111827" />

    <!-- Samson Post / Triangular Derrick Support Legs (A-Frame) -->
    <!-- Left Leg -->
    <polygon points="144,171 147,171 158,118 155,118" fill="#111827" />
    <!-- Right Leg -->
    <polygon points="172,171 169,171 158,118 161,118" fill="#111827" />
    <!-- Vertical Center Spine -->
    <rect x="157" y="118" width="2" height="53" fill="#111827" />
    <!-- Ladder Rungs / Horizontal Braces -->
    <line x1="147" y1="156" x2="169" y2="156" stroke="#111827" stroke-width="1.8" />
    <line x1="150" y1="143" x2="166" y2="143" stroke="#111827" stroke-width="1.8" />
    <line x1="153" y1="131" x2="163" y2="131" stroke="#111827" stroke-width="1.8" />

    <!-- Center Saddle Bearing Pivot Cap -->
    <circle cx="158" cy="118" r="3.5" fill="#111827" />

    <!-- Walking Beam (Tilted I-Beam) -->
    <polygon points="132,143 186,104 187,110 133,149" fill="#111827" />

    <!-- Horse Head (Curved Rocking Cam on Front / Right Side) -->
    <path 
      d="M 184 97 C 187 96 195 98 198 107 C 200 114 199 122 196 128 L 191 126 C 193 120 194 113 192 108 C 190 103 186 102 184 102 Z" 
      fill="#111827" 
    />
    <polygon points="184,97 186,108 193,105" fill="#111827" />

    <!-- Wire Bridle & Polished Rod Dropping into Wellhead -->
    <line x1="196" y1="126" x2="196" y2="171" stroke="#111827" stroke-width="1.8" />
    <!-- Wellhead / Stuffing Box -->
    <rect x="193" y="165" width="6" height="6" fill="#111827" rx="0.5" />

    <!-- Pitman Arm (Connecting beam to crank) -->
    <line x1="133" y1="146" x2="128" y2="160" stroke="#111827" stroke-width="3" stroke-linecap="round" />

    <!-- Counterweight & Crank (Rotary Wheel on Left) -->
    <path d="M 120 162 C 120 155 125 151 132 151 C 137 151 141 155 141 162 C 141 167 136 170 130 170 C 124 170 120 167 120 162 Z" fill="#111827" />
    <circle cx="130" cy="161" r="2.2" fill="#FFFFFF" />

    <!-- Motor & Gear Reducer Base Unit -->
    <rect x="115" y="164" width="12" height="7" fill="#111827" rx="1" />
  </g>

  <!-- 6. Sanskrit Motto Below Gear Emblem -->
  <!-- || तेजस्विनावधीतमस्तु || -->
  <text 
    x="160" 
    y="328" 
    fill="#111827" 
    font-family="'Noto Sans Devanagari', 'Mangal', 'Poppins', -apple-system, sans-serif" 
    font-size="20" 
    font-weight="700" 
    text-anchor="middle"
    letter-spacing="1.2"
  >
    ॥ तेजस्विनावधीतमस्तु ॥
  </text>
</svg>
